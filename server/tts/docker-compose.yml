services:
  tts:
    build: .
    ports: ["8000:8000"]
    environment:
      TTS_API_KEY: ${TTS_API_KEY:?scegli una chiave lunga e casuale nel file .env}
      TTS_PREWARM: "1"
    volumes: ["./data:/data"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
