# Dialog di sistema Android dei permessi: tocca "Consenti" (id stabile di permissioncontroller; ripiego sul testo IT/EN).
appId: com.lifepilot.app
---
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_allow_button"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_button"
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
